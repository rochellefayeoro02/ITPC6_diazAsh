<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsecure Website</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;

    font-family: "Inter", "Roboto", "Open Sans", sans-serif;
    color: #000000;

    /* Minimalist background */
    background-color: lab(46.01% 4.5 -7.22);
    position: relative;
    overflow: hidden;
  }

  /* Minimalist background icons */
  body::before {
    content: "⌨   { }  ⚙   ◇   #   @   01   []   +   < >   / /   •   ◆ ";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;
    line-height: 3;
    letter-spacing: 25px;
    word-spacing: 35px;

    color: rgba(91, 33, 182, 0.08);

    transform: rotate(-12deg) scale(1.3);
    pointer-events: none;
    z-index: 0;
  }

  /* Form */
  .form-container {
    position: relative;
    z-index: 1;

    width: min(100%, 410px);

    background: lab(94.06% -17.2 -3.51 / 0.961);

    padding: 30px 32px;

    border: 1px solid hwb(189 4% 10% / 0.479);

    /* Rounded / oval sides */
    border-radius: 28px;

    box-shadow:
      0 15px 40px rgba(0, 0, 0, 0.12),
      0 0 0 1px #02c8fa80;
  }

  h1 {
    margin: 0 0 25px;

    color: #000000;

    text-align: center;

    font-size: 1.7rem;
    font-weight: 700;
  }

  form {
    text-align: left;
  }

  .form-container label {
    display: block;

    color: #000000;

    font-size: 0.92rem;
    font-weight: 700;

    margin-bottom: 5px;
  }

  .form-container input,
  .form-container select {
    width: 100%;
    height: 40px;

    padding: 0 14px;
    margin: 0 0 13px;

    border: 1px solid #c4b5fd;

    /* Rounded input sides */
    border-radius: 20px;

    background-color: #ffffff;

    color: #000000;

    font: inherit;
    outline: none;

    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }

  .form-container input:focus,
  .form-container select:focus {
    border-color: #03f7ff;

    box-shadow:
      0 0 0 3px rgba(124, 58, 237, 0.12);
  }

  .form-container input::placeholder {
    color: #14c8f5;
  }

  .form-container select {
    cursor: pointer;
  }

  /* Register button */
  .button {
    width: 100%;

    padding: 12px 25px;

    margin-top: 5px;

    border: none;

    background: #05cafc;

    color: #ffffff;

    border-radius: 20px;

    font: inherit;
    font-weight: 700;

    cursor: pointer;

    transition:
      background-color 0.2s,
      transform 0.2s;
  }

  .button:hover {
    background: #45b0ee;

    transform: translateY(-1px);
  }

  .form-container p {
    margin: 18px 0 0;

    color: #000000;

    text-align: center;

    font-size: 0.9rem;
  }

  .form-container a {
    color: #6d28d9;

    font-weight: 700;

    text-decoration: none;
  }

  .form-container a:hover {
    text-decoration: underline;
  }

  /* Small decorative circle */
  .form-container::before {
    content: "::";

    position: absolute;

    top: -18px;
    left: 50%;

    transform: translateX(-50%);

    width: 45px;
    height: 45px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #7c3aed;

    color: #ffffff;

    border-radius: 50%;

    font-size: 13px;
    font-weight: bold;

    box-shadow: 0 5px 15px rgba(26, 236, 243, 0.3);
  }

  @media (max-width: 420px) {

    body {
      padding: 15px;
    }

    .form-container {
      padding: 28px 20px;
      border-radius: 24px;
    }

    h1 {
      font-size: 1.5rem;
    }

    body::before {
      font-size: 22px;
      letter-spacing: 15px;
      word-spacing: 20px;
    }
  }
</style>
</head>

<body>

<div class="form-container">

  <h1>"Registration Form"</h1>

  <form action="registration.php" method="post">

    <label for="fullname">Fullname:</label>
    <input
      type="text"
      name="fullname"
      id="fullname"
      required
    >

    <label for="username">Username:</label>
    <input
      type="text"
      name="username"
      id="username"
      maxlength="25"
      required
    >

    <label for="password">Password:</label>
    <input
      type="password"
      name="password"
      id="password"
      required
    >

    <label for="confirm_password">Confirm Password:</label>
    <input
      type="password"
      name="confirm_password"
      id="confirm_password"
      required
    >

    <label for="age">Age:</label>
    <input
      type="number"
      name="age"
      id="age"
      min="1"
      required
    >

    <label for="gender">Gender:</label>
    <select
      name="gender"
      id="gender"
      required
    >
      <option value="">Select gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
      <option value="Others">Others</option>
    </select>

    <label for="address">Address:</label>
    <input
      type="text"
      name="address"
      id="address"
      required
    >

    <button
      class="button"
      type="submit"
      name="register"
    >
      Register
    </button>

    <p>
      Already have an account?
      <a href="login.php">Login here</a>
    </p>

  </form>

</div>

</body>
</html>
